# ปลุกเซิร์ฟเวอร์จากภายนอก เสริม initKeepAlive ใน server.js (ซึ่ง ping ตัวเองได้เฉพาะตอนยังตื่นอยู่)
# ถ้า Render หลับไปแล้ว (เช่นรีสตาร์ตเครื่องแล้วไม่มีคนเข้า) งานนี้จะปลุกขึ้นมา จากนั้น server.js กันหลับต่อเอง
# GitHub อาจเลื่อนเวลารันไปบ้างตอนคิวแน่น ไม่เป็นไรเพราะเป็นแค่ชั้นสำรอง
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null https://api.peetiwnong.site/api/site-settings
