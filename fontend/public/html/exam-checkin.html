<!DOCTYPE html>
<html lang="th">

<head>
    <script src="/js/config.js?v=20260923-1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คอินสอบอธิบาย - PTN Camp</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon/favicon.png">

    <link rel="stylesheet" href="../css/base/variables.css">
    <link rel="stylesheet" href="../css/base/utilities.css">
    <link rel="stylesheet" href="../css/base/loader.css">
    <link rel="stylesheet" href="../css/pages/exam-checkin.css?v=20260916-2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="exam-checkin-body">
    <main class="exam-checkin-card">
        <img src="../../assets/images/logo/logo1.png" alt="PTN logo" class="exam-checkin-logo">

        <div id="exam-checkin-loading" class="exam-checkin-state">
            <div class="exam-checkin-spinner"></div>
            <p>กำลังเช็คอิน...</p>
        </div>

        <div id="exam-checkin-success" class="exam-checkin-state hidden">
            <div class="exam-checkin-icon exam-checkin-icon--success">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h1>เช็คอินสำเร็จ</h1>
            <p id="exam-checkin-success-detail"></p>
            <p class="exam-checkin-hint">กรุณารอพี่ค่ายเริ่มการสอบ</p>
        </div>

        <div id="exam-checkin-error" class="exam-checkin-state hidden">
            <div class="exam-checkin-icon exam-checkin-icon--error">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
            <h1>เช็คอินไม่สำเร็จ</h1>
            <p id="exam-checkin-error-detail"></p>
        </div>

        <div id="exam-checkin-login-required" class="exam-checkin-state hidden">
            <div class="exam-checkin-icon exam-checkin-icon--error">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m0 0l3-3m-3 3l3 3m10-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1>กรุณาเข้าสู่ระบบก่อน</h1>
            <p>ต้องเข้าสู่ระบบด้วยบัญชีน้องค่ายก่อนถึงจะเช็คอินเข้าสอบได้</p>
            <a href="/" class="exam-checkin-home-link">ไปหน้าเข้าสู่ระบบ</a>
        </div>

        <a href="/" class="exam-checkin-home-link exam-checkin-home-link--muted">กลับหน้าแรก</a>
    </main>

    <script src="../js/pages/exam-checkin.js"></script>
</body>

</html>
